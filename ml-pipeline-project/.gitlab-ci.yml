image: python:3.9

stages:
  - install
  - test
  - validate
  - train
  - deploy

variables:
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"

cache:
  paths:
    - .cache/pip
    - venv/

before_script:
  - python --version
  - pip install virtualenv
  - virtualenv venv
  - source venv/bin/activate
  - pip install -r requirements.txt

# Установка зависимостей
install:
  stage: install
  script:
    - echo "Installing dependencies..."
    - pip list
  artifacts:
    paths:
      - venv/
    expire_in: 1 hour

# Тестирование и линтинг
test:lint:
  stage: test
  script:
    - pip install flake8 black isort
    - echo "Running linting..."
    - flake8 src/ --max-line-length=100 --ignore=E203,W503 || true
    - black --check src/ || true
    - isort --check-only src/ || true
  allow_failure: true

test:unit:
  stage: test
  script:
    - pip install pytest pytest-cov
    - echo "Running unit tests..."
    - pytest tests/ --cov=src --cov-report=xml --cov-report=html || true
  coverage: '/(?i)total.*? (100(?:\.0+)?\%|[1-9]?\d(?:\.\d+)?\%)$/'
  artifacts:
    reports:
      coverage_report:
        coverage_format: cobertura
        path: coverage.xml
    paths:
      - htmlcov/
    expire_in: 1 week
  allow_failure: true

# Валидация данных
validate:deepchecks:
  stage: validate
  script:
    - echo "Running Deepchecks validation..."
    - cd src
    - python deepchecks_validation.py
  artifacts:
    paths:
      - reports/deepchecks_*.html
    expire_in: 1 week

validate:evidently:
  stage: validate
  script:
    - echo "Running Evidently AI monitoring..."
    - cd src
    - python evidently_monitoring.py
  artifacts:
    paths:
      - reports/evidently_*.html
      - reports/distribution_comparison.csv
    expire_in: 1 week

# Обучение модели
train:random-forest:
  stage: train
  script:
    - echo "Training Random Forest model..."
    - cd src
    - python train.py --model-type rf --n-estimators 100 --max-depth 10
  artifacts:
    paths:
      - models/
      - mlruns/
      - reports/predictions.csv
    expire_in: 1 month
  only:
    - main
    - develop

train:linear-regression:
  stage: train
  script:
    - echo "Training Linear Regression model..."
    - cd src
    - python train.py --model-type lr
  artifacts:
    paths:
      - models/
      - mlruns/
    expire_in: 1 week
  allow_failure: true
  only:
    - main

# Деплой модели
deploy:staging:
  stage: deploy
  script:
    - echo "Deploying to staging..."
    - echo "Model artifacts ready for deployment"
    - ls -lah models/
  environment:
    name: staging
    url: https://staging.example.com
  only:
    - develop
  when: manual

deploy:production:
  stage: deploy
  script:
    - echo "Deploying to production..."
    - echo "Timestamp: $(date)"
    - |
      cat > deployment_info.txt << EOF
      Deployment Information
      =====================
      Date: $(date)
      Commit: $CI_COMMIT_SHA
      Branch: $CI_COMMIT_BRANCH
      Pipeline: $CI_PIPELINE_ID
      Job: $CI_JOB_ID
      EOF
    - cat deployment_info.txt
  artifacts:
    paths:
      - deployment_info.txt
    expire_in: 1 year
  environment:
    name: production
    url: https://production.example.com
  only:
    - main
  when: manual

# Генерация отчета
pages:
  stage: deploy
  script:
    - mkdir -p public
    - cp -r reports/*.html public/ || true
    - cp -r htmlcov public/ || true
    - |
      cat > public/index.html << EOF
      <!DOCTYPE html>
      <html>
      <head>
        <title>ML Pipeline Reports</title>
        <style>
          body { font-family: Arial, sans-serif; margin: 40px; }
          h1 { color: #333; }
          ul { line-height: 2; }
          a { color: #0066cc; text-decoration: none; }
          a:hover { text-decoration: underline; }
        </style>
      </head>
      <body>
        <h1>ML Pipeline Reports</h1>
        <h2>Deepchecks Reports</h2>
        <ul>
          <li><a href="deepchecks_data_integrity.html">Data Integrity</a></li>
          <li><a href="deepchecks_model_evaluation.html">Model Evaluation</a></li>
        </ul>
        <h2>Evidently AI Reports</h2>
        <ul>
          <li><a href="evidently_data_drift.html">Data Drift</a></li>
          <li><a href="evidently_data_quality.html">Data Quality</a></li>
          <li><a href="evidently_model_performance.html">Model Performance</a></li>
          <li><a href="evidently_drift_tests.html">Drift Tests</a></li>
        </ul>
        <h2>Coverage Report</h2>
        <ul>
          <li><a href="htmlcov/index.html">Code Coverage</a></li>
        </ul>
      </body>
      </html>
      EOF
  artifacts:
    paths:
      - public
  only:
    - main
