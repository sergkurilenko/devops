name: ML Pipeline CI/CD

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  schedule:
    - cron: '0 0 * * *'

env:
  PROJECT_DIR: ml-pipeline-project

defaults:
  run:
    shell: bash
    working-directory: ${{ env.PROJECT_DIR }}

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v3
      with:
        path: ${{ env.PROJECT_DIR }}   
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.9'

    - name: Cache dependencies
      uses: actions/cache@v3
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles(format('{0}/requirements.txt', env.PROJECT_DIR)) }}
        restore-keys: |
          ${{ runner.os }}-pip-

    - name: Install dependencies
      run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
    
    - name: Run linting
      run: |
        pip install flake8 black isort
        flake8 src/ --max-line-length=100 --ignore=E203,W503
        black --check src/
        isort --check-only src/
    
    - name: Run tests
      run: |
        pip install pytest pytest-cov
        pytest tests/ --cov=src --cov-report=xml --cov-report=html
    
    - name: Upload coverage reports
      uses: codecov/codecov-action@v3
      with:
        file: ./coverage.xml
        flags: unittests
        name: codecov-umbrella

  data-validation:
    name: Data Validation
    runs-on: ubuntu-latest
    needs: test
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.9'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    
    - name: Run Deepchecks validation
      run: |
        cd src
        python deepchecks_validation.py
    
    - name: Upload Deepchecks reports
      uses: actions/upload-artifact@v3
      with:
        name: deepchecks-reports
        path: reports/deepchecks_*.html

  drift-monitoring:
    name: Data Drift Monitoring
    runs-on: ubuntu-latest
    needs: test
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.9'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    
    - name: Run Evidently AI monitoring
      run: |
        cd src
        python evidently_monitoring.py
    
    - name: Upload Evidently reports
      uses: actions/upload-artifact@v3
      with:
        name: evidently-reports
        path: reports/evidently_*.html

  train-model:
    name: Train ML Model
    runs-on: ubuntu-latest
    needs: [data-validation, drift-monitoring]
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.9'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    
    - name: Train model with MLflow
      env:
        MLFLOW_TRACKING_URI: ${{ secrets.MLFLOW_TRACKING_URI || 'file:./mlruns' }}
      run: |
        cd src
        python train.py --model-type rf --n-estimators 100 --max-depth 10
    
    - name: Upload model artifacts
      uses: actions/upload-artifact@v3
      with:
        name: trained-model
        path: |
          models/
          mlruns/
    
    - name: Upload predictions
      uses: actions/upload-artifact@v3
      with:
        name: predictions
        path: reports/predictions.csv

  deploy:
    name: Deploy Model
    runs-on: ubuntu-latest
    needs: train-model
    if: github.ref == 'refs/heads/main'
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3
    
    - name: Download model artifacts
      uses: actions/download-artifact@v3
      with:
        name: trained-model
    
    - name: Deploy to production
      run: |
        echo "Deploying model to production..."
        # Здесь можно добавить скрипт для деплоя
        # Например, загрузка модели в S3, регистрация в MLflow Model Registry и т.д.
    
    - name: Notify deployment
      run: |
        echo "Model deployed successfully!"
        echo "Timestamp: $(date)"

  report:
    name: Generate Summary Report
    runs-on: ubuntu-latest
    needs: [data-validation, drift-monitoring, train-model]
    if: always()
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3
    
    - name: Download all artifacts
      uses: actions/download-artifact@v3
    
    - name: Generate summary
      run: |
        echo "# ML Pipeline Summary" > summary.md
        echo "" >> summary.md
        echo "## Run Information" >> summary.md
        echo "- Date: $(date)" >> summary.md
        echo "- Commit: ${{ github.sha }}" >> summary.md
        echo "- Branch: ${{ github.ref }}" >> summary.md
        echo "" >> summary.md
        echo "## Artifacts Generated" >> summary.md
        echo "- Deepchecks reports" >> summary.md
        echo "- Evidently AI reports" >> summary.md
        echo "- Trained model" >> summary.md
        echo "- Predictions" >> summary.md
    
    - name: Upload summary
      uses: actions/upload-artifact@v3
      with:
        name: pipeline-summary
        path: summary.md
