name: ML Pipeline CI/CD

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  schedule:
    - cron: '0 0 * * *'

env:
  YC_S3_ENDPOINT: https://storage.yandexcloud.net
  YC_S3_REGION: ru-central1

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Cache dependencies
        uses: actions/cache@v3
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('ml-pipeline-project/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r "$GITHUB_WORKSPACE/ml-pipeline-project/requirements.txt"

      - name: Run linting
        working-directory: ${{ github.workspace }}/ml-pipeline-project
        run: |
          pip install flake8 black isort
          flake8 src/ --max-line-length=100 --ignore=E203,W503,E226,W293,F401,F403,F841,E501,F405,F541
          black src/
          isort src/

      - name: Run tests
        working-directory: ${{ github.workspace }}/ml-pipeline-project
        run: |
          pip install pytest pytest-cov
          pytest tests/ --cov=src --cov-report=xml --cov-report=html

      - name: Upload coverage reports
        uses: codecov/codecov-action@v3
        with:
          file: ml-pipeline-project/coverage.xml
          flags: unittests
          name: codecov-umbrella

  data-validation:
    name: Data Validation
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r "$GITHUB_WORKSPACE/ml-pipeline-project/requirements.txt"
          pip install anywidget

      # ВАЖНО: запускаем из src, чтобы ../reports => ml-pipeline-project/reports
      - name: Run Deepchecks validation
        working-directory: ${{ github.workspace }}/ml-pipeline-project/src
        run: |
          python deepchecks_validation.py
          echo "Reports folder:"
          ls -la ../reports || true

      - name: Upload Deepchecks reports
        uses: actions/upload-artifact@v4
        with:
          name: deepchecks-reports
          path: ml-pipeline-project/reports/deepchecks_*.html
          if-no-files-found: warn

  drift-monitoring:
    name: Data Drift Monitoring
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r "$GITHUB_WORKSPACE/ml-pipeline-project/requirements.txt"

      # ВАЖНО: запускаем из src, чтобы ../reports => ml-pipeline-project/reports
      - name: Run Evidently AI monitoring
        working-directory: ${{ github.workspace }}/ml-pipeline-project/src
        run: |
          python evidently_monitoring.py
          echo "Reports folder:"
          ls -la ../reports || true

      - name: Upload Evidently reports
        uses: actions/upload-artifact@v4
        with:
          name: evidently-reports
          path: ml-pipeline-project/reports/evidently_*.html
          if-no-files-found: warn

  train-model:
    name: Train ML Model
    runs-on: ubuntu-latest
    needs: [data-validation, drift-monitoring]

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r "$GITHUB_WORKSPACE/ml-pipeline-project/requirements.txt"

      # ВАЖНО: запускаем train из src, чтобы ../models и ../reports были внутри ml-pipeline-project
      - name: Train model with MLflow
        working-directory: ${{ github.workspace }}/ml-pipeline-project/src
        env:
          MLFLOW_TRACKING_URI: ${{ secrets.MLFLOW_TRACKING_URI || 'file:./mlruns' }}
        run: |
          python train.py --model-type rf --n-estimators 100 --max-depth 10
          echo "Models folder:"
          ls -la ../models || true
          echo "Reports folder:"
          ls -la ../reports || true

      # S3 only
      - name: Install AWS CLI
        run: python -m pip install awscli

      - name: Configure AWS CLI for Yandex Object Storage
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.YC_S3_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.YC_S3_SECRET_ACCESS_KEY }}
        run: |
          aws configure set aws_access_key_id "$AWS_ACCESS_KEY_ID"
          aws configure set aws_secret_access_key "$AWS_SECRET_ACCESS_KEY"
          aws configure set default.region $YC_S3_REGION
          aws configure set endpoint_url $YC_S3_ENDPOINT

      - name: Pack model artifacts
        working-directory: ${{ github.workspace }}/ml-pipeline-project
        run: |
          tar -czf model-${{ github.sha }}.tar.gz models
          ls -la model-${{ github.sha }}.tar.gz

      - name: Upload model archive to S3 (Yandex Object Storage)
        working-directory: ${{ github.workspace }}/ml-pipeline-project
        env:
          YC_S3_BUCKET: ${{ secrets.YC_S3_BUCKET }}
        run: |
          aws --endpoint-url=$YC_S3_ENDPOINT s3 cp \
            model-${{ github.sha }}.tar.gz \
            s3://$YC_S3_BUCKET/models/model-${{ github.sha }}.tar.gz

          aws --endpoint-url=$YC_S3_ENDPOINT s3 cp \
            model-${{ github.sha }}.tar.gz \
            s3://$YC_S3_BUCKET/models/latest.tar.gz

      - name: Upload predictions (GitHub)
        uses: actions/upload-artifact@v4
        with:
          name: predictions
          path: ml-pipeline-project/reports/predictions.csv
          if-no-files-found: warn

  deploy:
    name: Deploy Model
    runs-on: ubuntu-latest
    needs: train-model
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Install AWS CLI
        run: python -m pip install awscli

      - name: Configure AWS CLI for Yandex Object Storage
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.YC_S3_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.YC_S3_SECRET_ACCESS_KEY }}
        run: |
          aws configure set aws_access_key_id "$AWS_ACCESS_KEY_ID"
          aws configure set aws_secret_access_key "$AWS_SECRET_ACCESS_KEY"
          aws configure set default.region $YC_S3_REGION
          aws configure set endpoint_url $YC_S3_ENDPOINT

      - name: Download model archive from S3 and unpack
        working-directory: ${{ github.workspace }}/ml-pipeline-project
        env:
          YC_S3_BUCKET: ${{ secrets.YC_S3_BUCKET }}
        run: |
          aws --endpoint-url=$YC_S3_ENDPOINT s3 cp \
            s3://$YC_S3_BUCKET/models/model-${{ github.sha }}.tar.gz \
            ./model.tar.gz
          tar -xzf model.tar.gz
          ls -la models

      - name: Deploy to production
        working-directory: ${{ github.workspace }}/ml-pipeline-project
        run: |
          echo "Deploying model to production..."
          # ваш реальный деплой

      - name: Notify deployment
        run: |
          echo "Model deployed successfully!"
          echo "Timestamp: $(date)"

  report:
    name: Generate Summary Report
    runs-on: ubuntu-latest
    needs: [data-validation, drift-monitoring, train-model]
    if: always()

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Download all artifacts
        uses: actions/download-artifact@v4

      - name: Generate summary
        working-directory: ${{ github.workspace }}/ml-pipeline-project
        run: |
          echo "# ML Pipeline Summary" > summary.md
          echo "" >> summary.md
          echo "## Run Information" >> summary.md
          echo "- Date: $(date)" >> summary.md
          echo "- Commit: ${{ github.sha }}" >> summary.md
          echo "- Branch: ${{ github.ref }}" >> summary.md
          echo "" >> summary.md
          echo "## Artifacts Generated" >> summary.md
          echo "- Deepchecks reports" >> summary.md
          echo "- Evidently AI reports" >> summary.md
          echo "- Predictions" >> summary.md
          echo "- Trained model stored in S3: models/model-${{ github.sha }}.tar.gz" >> summary.md

      - name: Upload summary
        uses: actions/upload-artifact@v4
        with:
          name: pipeline-summary
          path: ml-pipeline-project/summary.md
